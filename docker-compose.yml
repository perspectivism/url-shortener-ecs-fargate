# Local development stack (SPEC §15).
#   default profile: AWS service emulators only (for `go run` / integration tests)
#   profile "app":   + init (local-init), redirect :8080, api :8081, worker
#   profile "jobs":  nightly (run on demand: docker compose run --rm nightly)
# App containers run exactly like ECS tasks: read-only root filesystem, all
# Linux capabilities dropped, no privilege escalation, non-root UID 65532.
# Images are pinned by tag and digest. Ports bind to 127.0.0.1 only.
name: url-shortener

x-app: &app
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "65532:65532"
  profiles: ["app"]
  env_file:
    - path: .env.example
    - path: .env
      required: false
  environment: &app-env
    AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
    AWS_ENDPOINT_URL_SQS: http://sqs:9324
    AWS_ENDPOINT_URL_S3: http://s3:9090
    CACHE_ADDR: valkey:6379
    HTTP_ADDR: ":8080"
  healthcheck:
    test: ["CMD", "/app", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 12

x-after-init: &after-init
  depends_on:
    init:
      condition: service_completed_successfully

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["127.0.0.1:8000:8000"]

  valkey:
    image: valkey/valkey:9.0.6-alpine3.24@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  sqs:
    image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    ports: ["127.0.0.1:9324:9324"]

  s3:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    ports: ["127.0.0.1:9090:9090"]

  init:
    <<: *app
    image: shortener/shortenerctl:${APP_IMAGE_TAG:-local}
    command: ["local-init"]
    healthcheck:
      disable: true
    depends_on: [dynamodb, valkey, sqs, s3]
    restart: "no"

  redirect:
    <<: [*app, *after-init]
    image: shortener/redirect:${APP_IMAGE_TAG:-local}
    ports: ["127.0.0.1:8080:8080"]

  api:
    <<: [*app, *after-init]
    image: shortener/api:${APP_IMAGE_TAG:-local}
    ports: ["127.0.0.1:8081:8080"]

  worker:
    <<: [*app, *after-init]
    image: shortener/worker:${APP_IMAGE_TAG:-local}
    environment:
      <<: *app-env
      WORKER_FLUSH_INTERVAL: 10s

  nightly:
    <<: *app
    profiles: ["jobs"]
    image: shortener/nightly:${APP_IMAGE_TAG:-local}
    healthcheck:
      disable: true
    restart: "no"
