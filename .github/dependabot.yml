# Dependency updates (SPEC §14), monthly for every ecosystem. Dependabot also
# bumps the emulator images in docker-compose.yml (tag and digest). The CLI
# tools pinned in .tool-versions are bumped by hand, because Dependabot cannot
# update the checksums scripts/install-tools.sh verifies.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: monthly }
    groups:
      aws-sdk: { patterns: ["github.com/aws/*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /build
    schedule: { interval: monthly }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }

  - package-ecosystem: terraform
    directories: [/infra/bootstrap, /infra/envs/dev, /infra/envs/prod]
    schedule: { interval: monthly }
    groups:
      providers: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /tools
    schedule: { interval: monthly }
    groups:
      python-tools: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /tools
    schedule: { interval: monthly }
    groups:
      node-tools: { patterns: ["*"] }
