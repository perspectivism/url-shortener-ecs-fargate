# Deployment (SPEC §14, ADR-0017, ADR-0027, ADR-0028): build the arm64 images
# once; for each environment, plan, wait for approval of that saved plan, then
# push the same digests, apply exactly that plan and smoke test; prod last,
# then create the release.
#
# Approval model: nothing deploys automatically, and reviewers approve a plan.
#   1. A human starts this workflow (Actions -> deploy -> Run workflow) on main;
#      there is no push or schedule trigger, and other refs are refused.
#   2. plan-<env> runs in the `<env>-plan` environment (no reviewers) with a
#      read-only role, prints the full plan and stores the saved plan in the
#      private state bucket; its SHA-256 is the job output.
#   3. <env> runs in the `<env>` environment, whose required reviewer approves
#      after reading that plan. Only then can it assume the apply role; it
#      applies the saved plan only if its SHA-256 matches (scripts/saved-plan.sh).
#      A changed state makes the saved plan stale and the apply fails; re-run.
# APPROVED / PROD_APPLY_CONFIRMED below record those human approvals for
# scripts/tf-apply.sh and scripts/push-images.sh.
#
# Prerequisites (runbook "CI/CD setup"): bootstrap applied, phase 1 applied and
# secrets seeded; GitHub environments dev-plan/prod-plan (variables
# AWS_DEPLOY_PLAN_ROLE_ARN, ALERT_EMAIL) and dev/prod (required reviewers,
# variable AWS_APPLY_ROLE_ARN, secret SMOKE_API_KEY); repository variables
# TF_STATE_BUCKET, TF_STATE_KMS_KEY_ARN and AWS_REGION. Every other setting is
# in the committed infra/envs/<env>/deploy.tfvars (ADR-0028).
name: deploy

on:
  workflow_dispatch: # manual only: never on push, merge or schedule

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt an apply

jobs:
  build:
    name: build arm64 images (once)
    if: github.ref == 'refs/heads/main' # deploy only what is on main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release tags for scripts/version.sh (ADR-0026)
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # No tool cache in the release path (cache poisoning); tools are checksum-verified.
      - run: make tools
      - id: build
        run: |
          make images-oci
          echo "tag=$(cat dist/images/tag)" >>"$GITHUB_OUTPUT"
          echo "built version $(cat dist/images/version)" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: dist/images
          retention-days: 7
          if-no-files-found: error

  plan-dev:
    name: plan dev (review this before approving dev)
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev-plan # no reviewers; read-only role (OIDC sub ...:environment:dev-plan)
    permissions:
      contents: read
      id-token: write # OIDC for the read-only dev deploy plan role
    outputs:
      plan_sha256: ${{ steps.store.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: plan-dev-${{ github.run_id }}
      - name: plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          REPOSITORY: ${{ github.repository }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          scripts/ci-config.sh dev
          make plan ENV=dev
          {
            echo "### dev plan (approve the dev job only if this is what should change)"
            echo '```text'
            cat infra/envs/dev/plan-summary.txt
            echo '```'
            echo "<details><summary>full plan</summary>"
            echo
            echo '```text'
            .tools/bin/terraform -chdir=infra/envs/dev show -no-color tfplan | head -c 800000
            echo '```'
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"
      - id: store
        name: store the saved plan (private state bucket)
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          sha="$(scripts/saved-plan.sh put dev)"
          echo "sha256=$sha" >>"$GITHUB_OUTPUT"
          echo "saved plan SHA-256: \`$sha\`" >>"$GITHUB_STEP_SUMMARY"

  dev:
    name: apply dev
    needs: [build, plan-dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: dev # required reviewers: approve after reading plan-dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC for the dev apply role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: dist/images
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-dev-${{ github.run_id }}
      - name: fetch and verify the approved saved plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          REPOSITORY: ${{ github.repository }}
          PLAN_SHA256: ${{ needs.plan-dev.outputs.plan_sha256 }}
        run: |
          scripts/ci-config.sh dev # backend.hcl for terraform init
          scripts/saved-plan.sh get dev "$PLAN_SHA256"
      - name: push images (verified digests)
        env:
          APPROVED: "yes" # started by hand on main + dev reviewers approved this saved plan
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: make push-images ENV=dev
      - name: apply the approved saved plan
        env:
          APPROVED: "yes" # started by hand on main + dev reviewers approved this saved plan
        run: make apply ENV=dev
      - name: delete the applied plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          PLAN_SHA256: ${{ needs.plan-dev.outputs.plan_sha256 }}
        run: scripts/saved-plan.sh rm dev "$PLAN_SHA256"
      - name: smoke
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: make smoke-env ENV=dev

  plan-prod:
    name: plan prod (review this before approving prod)
    needs: [build, dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod-plan # no reviewers; read-only role (OIDC sub ...:environment:prod-plan)
    permissions:
      contents: read
      id-token: write # OIDC for the read-only prod deploy plan role
    outputs:
      plan_sha256: ${{ steps.store.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: plan-prod-${{ github.run_id }}
      - name: plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          REPOSITORY: ${{ github.repository }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          scripts/ci-config.sh prod
          make plan ENV=prod
          {
            echo "### prod plan (approve the prod job only if this is what should change)"
            echo '```text'
            cat infra/envs/prod/plan-summary.txt
            echo '```'
            echo "<details><summary>full plan</summary>"
            echo
            echo '```text'
            .tools/bin/terraform -chdir=infra/envs/prod show -no-color tfplan | head -c 800000
            echo '```'
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"
      - id: store
        name: store the saved plan (private state bucket)
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          sha="$(scripts/saved-plan.sh put prod)"
          echo "sha256=$sha" >>"$GITHUB_OUTPUT"
          echo "saved plan SHA-256: \`$sha\`" >>"$GITHUB_STEP_SUMMARY"

  prod:
    name: apply prod (same digests)
    needs: [build, plan-prod]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: prod # required reviewers: approve after reading plan-prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: write # create the GitHub Release + tag after prod smoke passes (ADR-0026)
      id-token: write # OIDC for the prod apply role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # previous release tag and commit list for the release notes
          persist-credentials: false
      - run: make tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: dist/images
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-prod-${{ github.run_id }}
      - name: fetch and verify the approved saved plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          REPOSITORY: ${{ github.repository }}
          PLAN_SHA256: ${{ needs.plan-prod.outputs.plan_sha256 }}
        run: |
          scripts/ci-config.sh prod # backend.hcl for terraform init
          scripts/saved-plan.sh get prod "$PLAN_SHA256"
      - name: push images (verified digests)
        env:
          APPROVED: "yes" # prod environment reviewers approved this saved plan
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: make push-images ENV=prod
      - name: apply the approved saved plan
        env:
          APPROVED: "yes" # prod environment reviewers approved this saved plan
          PROD_APPLY_CONFIRMED: "yes"
        run: make apply ENV=prod
      - name: delete the applied plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          PLAN_SHA256: ${{ needs.plan-prod.outputs.plan_sha256 }}
        run: scripts/saved-plan.sh rm prod "$PLAN_SHA256"
      - name: smoke
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: make smoke-env ENV=prod
      - name: release (tag + GitHub Release with the deployed digests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh
