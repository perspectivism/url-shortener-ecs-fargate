# Deployment (SPEC §14, ADR-0017, ADR-0027): build the arm64 images once,
# push the same digests to dev, apply, smoke; then promote the identical
# digests to prod and create the release.
#
# Approval model (ADR-0027): nothing deploys automatically.
#   1. A human starts this workflow (Actions -> deploy -> Run workflow) on main;
#      there is no push or schedule trigger, and other refs are refused.
#   2. The `dev` and `prod` GitHub environments both require a reviewer; each
#      job waits for that approval before it can assume its AWS role.
# APPROVED / PROD_APPLY_CONFIRMED below record those human approvals for
# scripts/tf-apply.sh and scripts/push-images.sh.
#
# Prerequisites (runbook "CI/CD setup"): bootstrap applied, phase 1 applied and
# secrets seeded, GitHub environments dev/prod with AWS_APPLY_ROLE_ARN,
# ALERT_EMAIL and the SMOKE_API_KEY secret, repository variables
# TF_STATE_BUCKET, TF_STATE_KMS_KEY_ARN, AWS_REGION and OWNER.
name: deploy

on:
  workflow_dispatch: # manual only: never on push, merge or schedule

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt an apply

jobs:
  build:
    name: build arm64 images (once)
    if: github.ref == 'refs/heads/main' # deploy only what is on main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release tags for scripts/version.sh (ADR-0026)
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # No tool cache in the release path (cache poisoning); tools are checksum-verified.
      - run: make tools
      - id: build
        run: |
          make images-oci
          echo "tag=$(cat dist/images/tag)" >>"$GITHUB_OUTPUT"
          echo "built version $(cat dist/images/version)" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: dist/images
          retention-days: 7
          if-no-files-found: error

  dev:
    name: deploy dev
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: dev # required reviewers: the job waits here for approval
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC for the dev apply role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: dist/images
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-dev-${{ github.run_id }}
      - name: push images (verified digests)
        env:
          APPROVED: "yes" # started by hand on main + dev environment reviewers approved
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: make push-images ENV=dev
      - name: plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ vars.OWNER }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          scripts/ci-config.sh dev
          make plan ENV=dev
          cat infra/envs/dev/plan-summary.txt >>"$GITHUB_STEP_SUMMARY"
      - name: apply the saved plan
        env:
          APPROVED: "yes" # started by hand on main + dev environment reviewers approved
        run: make apply ENV=dev
      - name: smoke
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: make smoke-env ENV=dev

  prod:
    name: deploy prod (same digests)
    needs: [build, dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: prod # required reviewers: the job waits here for approval
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: write # create the GitHub Release + tag after prod smoke passes (ADR-0026)
      id-token: write # OIDC for the prod apply role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # previous release tag and commit list for the release notes
          persist-credentials: false
      - run: make tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: dist/images
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-prod-${{ github.run_id }}
      - name: push images (verified digests)
        env:
          APPROVED: "yes" # prod environment reviewers approved this run
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: make push-images ENV=prod
      - name: plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ vars.OWNER }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          scripts/ci-config.sh prod
          make plan ENV=prod
          cat infra/envs/prod/plan-summary.txt >>"$GITHUB_STEP_SUMMARY"
      - name: apply the saved plan
        env:
          APPROVED: "yes" # prod environment reviewers approved this run
          PROD_APPLY_CONFIRMED: "yes"
        run: make apply ENV=prod
      - name: smoke
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: make smoke-env ENV=prod
      - name: release (tag + GitHub Release with the deployed digests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh
